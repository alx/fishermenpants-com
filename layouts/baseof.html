<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if not .IsHome }}{{ .Title }} — {{ end }}{{ .Site.Title }}</title>
  <meta name="description" content="{{ .Description | default .Site.Params.description }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <script>
    window.FP_CONFIG = {{ .Site.Params | jsonify | safeJS }};
    window.FP_BASE = {{ .Site.BaseURL | jsonify | safeJS }};
  </script>
</head>
<body>
  {{ partial "header.html" . }}
  <main id="main">
    {{ block "main" . }}{{ .Content }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  <div id="fp-toast" role="status" aria-live="polite"></div>
  <script defer src="{{ "js/slideshow.js" | relURL }}"></script>
  <script defer src="{{ "js/cart.js" | relURL }}"></script>
  <script defer src="{{ "js/paypal.js" | relURL }}"></script>
  <script defer src="{{ "js/search.js" | relURL }}"></script>
  <script defer src="{{ "js/country.js" | relURL }}"></script>
  <script defer src="{{ "js/newsletter.js" | relURL }}"></script>
</body>
</html>
