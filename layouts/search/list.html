{{ define "main" }}
<div class="wrap search-page">
  <h1>Search</h1>
  <form class="search-bar big" role="search" action="{{ "search/" | relURL }}" method="get">
    <input type="search" name="q" id="search-input" placeholder="Search products, collections…" autocomplete="off">
    <button type="submit">Search</button>
  </form>
  <p id="search-status" class="muted"></p>
  <div id="search-results" class="product-row product-row-grid"></div>
</div>
{{ end }}
