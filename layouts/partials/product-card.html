{{- $min := .Params.priceMin | default 0 -}}
{{- $max := .Params.priceMax | default 0 -}}
<a class="product-card" href="{{ .Permalink }}">
  <span class="pc-img"><img src="{{ if .Params.images }}{{ index .Params.images 0 }}{{ else }}{{ "img/placeholder.svg" | relURL }}{{ end }}" alt="{{ .Title }}" loading="lazy"></span>
  <span class="pc-info">
    <span class="pc-title">{{ .Title }}</span>
    <span class="pc-price">{{ if gt (float $max) (float $min) }}from ${{ (float $min) | printf "%.2f" }} USD{{ else }}${{ (float $min) | printf "%.2f" }} USD{{ end }}</span>
  </span>
</a>
