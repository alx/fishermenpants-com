{{ define "main" }}
<div class="wrap cart-page">
  <h1>Your Cart</h1>
  <p class="country-row">
    <label for="country-select-cart">Shipping to:
      <select id="country-select-cart" class="country-select"></select>
    </label>
    <small class="muted">Shipping options and costs are calculated at checkout.</small>
  </p>
  <div id="cart-items"></div>
  <div id="cart-empty" class="muted" hidden>Your cart is empty. <a href="{{ "collections/all/" | relURL }}">Continue shopping</a>.</div>
  <div class="cart-totals">
    <div class="total-row"><span>Subtotal</span><strong id="cart-subtotal">$0.00 USD</strong></div>
    <div class="paypal-slot" id="paypal-buttons-cart"></div>
    <button id="checkout-note" class="btn-primary" style="display:none">Cart total is ready — use PayPal button above to pay</button>
  </div>
</div>
{{ end }}
