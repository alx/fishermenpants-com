name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install Pillow (image variants) + PyYAML (verify.py reads home.yaml)
        run: pip install --quiet Pillow PyYAML

      - name: Cache generated image variants
        uses: actions/cache@v4
        with:
          path: static/img/_gen
          key: img-gen-${{ hashFiles('tools/optimize_images.py', 'static/img/*.png', 'static/img/*.jpg', 'static/img/*.jpeg') }}

      - name: Install Hugo
        # Pinned: an unpinned install silently moved to 0.169 and broke the build
        # (_build front matter was removed in 0.145). Keep this in sync with
        # HUGO_VERSION expressed in the local dev environment.
        run: |
          npm install -g hugo-extended@${HUGO_VERSION}
          hugo version
        env:
          HUGO_VERSION: 0.169.0

      - name: Build site
        run: HUGO_BASEURL="${{ vars.BASE_URL || 'https://www.fishermenpants.com/' }}" ./build.sh
        env:
          BASE_URL: ${{ vars.BASE_URL }}

      # Gate the deploy on the built site actually being correct. These run
      # AFTER the build (they inspect public/) and BEFORE the artifact upload,
      # so a failure stops the deploy instead of shipping a broken site.
      # Deliberately no `|| true`: a red check must block.
      # This is the gap that let a page ship at /pages/mirror/ while templates
      # linked to /mirror/ — see tools/check_links.py.
      - name: Verify build
        run: python3 tools/verify.py

      - name: Check internal links
        run: python3 tools/check_links.py

      - name: Mirror consent + share tests
        run: python3 tools/test_mirror_share.py

      - name: Shipping economics tests
        run: python3 tools/test_shipping.py

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "public"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
