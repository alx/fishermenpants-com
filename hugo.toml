baseURL = "/"
languageCode = "en-us"
title = "Fishermen Pants"
enableRobotsTXT = true
hasCJKLanguage = false

[params]
  description = "Boutique by the sea in Lamai Beach, Koh Samui — beachwear, wrap pants, kimonos, caftans"
  facebook = "https://www.facebook.com/fishermenpants/"

  [params.paypal]
    # PayPal REST API client id (live: AX... / sandbox: sb). Replace to enable SDK buttons.
    clientId = "sb"
    currency = "USD"
    # Business account that receives payments (used by the classic checkout button).
    business = "thaifishpants@gmail.com"

  [params.formspree]
    # Create a free form at https://formspree.io and paste the endpoint here.
    # e.g. https://formspree.io/f/abcdwxyz — replace with your form's id
    endpoint = "https://formspree.io/f/your-form-id"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
