baseURL = "https://www.fishermenpants.com/"
languageCode = "en-us"
title = "Fishermen Pants"
enableRobotsTXT = true
hasCJKLanguage = false

[params]
  description = "Boutique by the sea in Lamai Beach, Koh Samui — beachwear, wrap pants, kimonos, caftans"
  facebook = "https://www.facebook.com/fishermenpants/"
  # Default social share image (1200x630), used when a page has no image of its own.
  ogImage = "/img/og-default.jpg"

  [params.paypal]
    # PayPal REST API client id (live: AX... / sandbox: sb). Replace to enable SDK buttons.
    clientId = "sb"
    currency = "USD"
    # Business account that receives payments (used by the classic checkout button).
    business = "thaifishpants@gmail.com"

  [params.business]
    name = "GAYA - boutique by the sea"
    phone = "+66625508121"
    phoneDisplay = "+66 62 550 8121"
    street = "156, beach 7 Had Lamai Rd, Tambon Maret"
    city = "Koh Samui, Surat Thani 84310"
    country = "Thailand"
    postal = "F29X+PM"
    hours = "Monday – Sunday, 9:00 am – 7:30 pm"
    mapsUrl = "https://maps.app.goo.gl/7ccyCNLymWZHUXz38"
    lat = 9.4693212
    lng = 100.0491771

  [params.formspree]
    # Create a free form at https://formspree.io and paste the endpoint here.
    # e.g. https://formspree.io/f/abcdwxyz — replace with your form's id
    endpoint = "https://formspree.io/f/xppdpbqk"

  [params.meta]
    # Meta (Facebook/Instagram) pixel id. Empty = pixel disabled.
    pixelId = ""

# Hugo version this site is built and tested with (CI pins the same version;
# build.sh refuses to run on a mismatch). See .github/workflows/pages.yml.
[module]
  [module.hugoVersion]
    min = "0.169.0"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
